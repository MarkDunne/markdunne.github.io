<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Japan 2026</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Japan 2026">
<meta name="theme-color" content="#ffffff">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<style>
  :root{--bg:#fff;--fg:#1a1a1a;--mu:#5f6368;--bd:#dadce0;--cd:#f6f6f4;--pr:#1a56db;--warn:#b45309}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans JP",sans-serif;color:var(--fg);background:var(--bg)}
  .app{display:grid;grid-template-columns:minmax(360px,460px) 1fr;height:100vh}
  aside{overflow-y:auto;border-right:1px solid var(--bd);padding:14px 16px 24px}
  #map{height:100%;width:100%;background:#e8eef3}
  h1{font-size:20px;margin:0 0 2px}
  h2{font-size:17px;margin:4px 0 8px}
  h3{font-size:15px;margin:16px 0 6px}
  .sub{color:var(--mu);font-size:13px}
  .shape{font-size:13px;margin:6px 0 0;padding:4px 8px;background:var(--cd);border-radius:8px;display:inline-block}
  nav{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 10px}
  nav button{font:inherit;font-size:13px;padding:5px 10px 5px 8px;border-radius:999px;border:1px solid var(--bd);background:#fff;color:var(--fg);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
  nav button .dot{width:10px;height:10px;border-radius:50%;display:inline-block}
  nav button.on{background:var(--fg);color:#fff;border-color:var(--fg)}
  .date{color:var(--mu);font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.03em}
  .panel{border-top:4px solid var(--c,#111);padding-top:8px}
  table.plan,table.tbl{border-collapse:collapse;width:100%;font-size:13px;margin:4px 0 8px}
  table.plan td,table.tbl td,table.tbl th{border-bottom:1px solid var(--bd);padding:6px 6px;vertical-align:top;text-align:left}
  table.plan td:first-child{white-space:nowrap;color:var(--mu);font-weight:600;width:1%;padding-right:10px}
  table.tbl th{color:var(--mu);font-weight:600}
  ul.notes{padding-left:18px;margin:6px 0;font-size:13px}
  ul.notes li{margin:3px 0}
  ul.legs{list-style:none;padding:0;margin:6px 0;font-size:13px}
  ul.legs li{display:flex;gap:8px;align-items:center;margin:4px 0}
  .sw{flex:none;width:30px;height:0;border-top:4px solid var(--c)}
  .sw.road{border-top-style:dotted}.sw.tunnel{border-top-style:dashed}.sw.walk{border-top:3px dotted var(--c)}.sw.ferry{border-top-style:dashed}.sw.ropeway{border-top-width:3px}
  a{color:var(--pr)}
  a.pl{text-decoration:none;border-bottom:1px dotted var(--pr)}
  a.gm{text-decoration:none;font-size:12px;margin-left:2px}
  .callout{background:#fff7ed;border:1px solid #fed7aa;border-radius:8px;padding:8px 10px;font-size:13px;margin:8px 0}
  .muted,.foot{color:var(--mu);font-size:12px}
  .foot{margin-top:18px;border-top:1px solid var(--bd);padding-top:8px}
  .profile svg{width:100%;height:auto;display:block}
  .profile text{font-size:12px;fill:var(--fg)}
  .profile .m{fill:var(--mu)}
  /* Leaflet overrides: nothing under 12px */
  .leaflet-container{font:13px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans JP",sans-serif}
  .leaflet-control-attribution,.leaflet-control-scale-line{font-size:12px!important}
  .leaflet-control-layers{font-size:13px}
  .leaflet-tooltip.lbl{font-size:12px;font-weight:600;padding:1px 5px;border-radius:4px;box-shadow:none;border:1px solid rgba(0,0,0,.25);background:rgba(255,255,255,.92)}
  .leaflet-tooltip.lbl:before{display:none}
  .pop b{font-size:14px}.pop .ja{color:var(--mu);font-size:12px;margin-left:4px}
  .pop .note{margin:4px 0}.pop .links a{margin-right:10px}
  .pop .warn{color:var(--warn);font-size:12px;margin-top:4px}.pop .days{color:var(--mu);font-size:12px}
  .legend{font-size:13px;line-height:1.7;color:var(--fg)}
  .legend .sw{display:inline-block;vertical-align:middle;margin-right:6px;width:28px;--c:#333}
  .mk{display:inline-block;vertical-align:middle;width:13px;height:13px;border-radius:50%;border:3px solid #333;background:#fff;margin:0 6px 0 8px}
  .mk.opt{border:2px dashed #333;background:rgba(0,0,0,.12)}
  .mk.oth{width:8px;height:8px;border:1px solid #666;background:#9aa0a6}
  .leaflet-tooltip.lbl.opt{font-weight:500;font-style:italic;border-style:dashed;background:rgba(255,255,255,.85)}
  ul.notes ul{padding-left:16px;margin:2px 0}
  h3.anch .mk,h3.opts .mk{margin:-2px 8px 0 0;border-color:var(--c)}

  .leaflet-control-attribution{display:none!important}
  .leaflet-control-layers-toggle{width:32px!important;height:32px!important}
  .map-toggle-btn{display:none}
  .chk-list{list-style:none;padding:0;margin:8px 0}
  .chk-list li{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;margin:6px 0;background:var(--cd);border-radius:8px;border:1px solid var(--bd);font-size:13px}
  .chk-list input[type=checkbox]{width:18px;height:18px;margin-top:2px;flex:none;accent-color:#16a34a;cursor:pointer}
  .chk-list li.done{opacity:.65;background:#f0fdf4;border-color:#bbf7d0}
  @media (max-width:900px){
    html,body{height:auto;min-height:100%;overflow-x:hidden;overflow-y:auto;-webkit-overflow-scrolling:touch}
    .app{display:flex;flex-direction:column;height:auto;min-height:100vh}
    #title,#subtitle,#shape{display:none}
    nav#nav{
      position:sticky;top:0;z-index:1200;
      background:rgba(255,255,255,.96);backdrop-filter:blur(6px);
      margin:0 -14px 8px;padding:8px 12px;
      border-bottom:1px solid var(--bd);
      flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none
    }
    nav#nav::-webkit-scrollbar{display:none}
    nav#nav button{flex:none;padding:5px 11px;font-size:13px}
    #map{
      order:1;height:215px;width:100%;flex:none;
      border-bottom:1px solid var(--bd);position:relative
    }
    aside{
      order:2;border-right:0;overflow:visible;
      padding:0 14px 36px
    }
    .map-toggle-btn{
      display:inline-flex;align-items:center;gap:5px;
      position:absolute;bottom:10px;left:10px;z-index:1000;
      background:rgba(17,24,39,.88);color:#fff;border:0;border-radius:999px;
      padding:6px 12px;font:600 12px system-ui,-apple-system,sans-serif;
      box-shadow:0 2px 6px rgba(0,0,0,.25);cursor:pointer
    }
    body.full-map #map{height:76vh}
    table.tbl,table.tbl tbody{display:block;width:100%}
    table.tbl tr:first-child{display:none}
    table.tbl tr{display:block;background:var(--cd);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;margin:8px 0}
    table.tbl td{display:block;border:0;padding:2px 0;font-size:13px}
    table.tbl td:first-child{font-size:11.5px;font-weight:700;color:var(--mu);text-transform:uppercase;letter-spacing:.03em}
    .leaflet-tooltip.lbl{font-size:11px;padding:1px 4px}
  }

  @media (max-width:0px){
    .app{grid-template-columns:1fr;grid-template-rows:55vh auto;height:auto}
    #map{height:55vh;grid-row:1}
    aside{grid-row:2;border-right:0;overflow:visible}
  }
</style>
</head>
<body>
<style>
  #lock-screen{position:fixed;inset:0;background:#111827;color:#f9fafb;display:flex;align-items:center;justify-content:center;z-index:9999;padding:20px}
  .lock-card{background:#1f2937;border:1px solid #374151;border-radius:16px;padding:28px 24px;max-width:360px;width:100%;box-shadow:0 20px 25px -5px rgba(0,0,0,.5);text-align:center}
  .lock-card h2{margin:0 0 6px;font-size:20px;color:#fff}
  .lock-card p{margin:0 0 18px;font-size:13px;color:#9ca3af;line-height:1.45}
  .lock-card input[type=password]{width:100%;padding:12px 14px;border-radius:10px;border:1px solid #4b5563;background:#111827;color:#fff;font-size:16px;margin-bottom:12px;outline:none}
  .lock-card input[type=password]:focus{border-color:#3b82f6}
  .lock-card button{width:100%;padding:12px;border-radius:10px;border:0;background:#2563eb;color:#fff;font:600 15px system-ui,-apple-system,sans-serif;cursor:pointer}
  .lock-card .err{color:#f87171;font-size:13px;margin-top:10px;display:none}
</style>
<div id="lock-screen">
  <form class="lock-card" id="lock-form">
    <div style="font-size:32px;margin-bottom:8px">🔒</div>
    <h2>Japan 2026</h2>
    <p>AES-256-GCM encrypted. Enter your passcode once — this device will remember it automatically.</p>
    <input type="password" id="pw-input" placeholder="Passcode" autocomplete="current-password" autofocus>
    <button type="submit" id="pw-btn">Unlock</button>
    <div class="err" id="pw-err">Incorrect passcode. Please try again.</div>
  </form>
</div>
<script>
try { if (localStorage.getItem('jp26_pw')) document.getElementById('lock-form').style.visibility = 'hidden'; } catch (e) {}
</script>
<div class="app" style="visibility:hidden" id="app-root">
  <aside>
    <h1 id="title"></h1>
    <div class="sub" id="subtitle"></div>
    <div class="shape" id="shape"></div>
    <nav id="nav"></nav>
    <section class="panel" id="panel"></section>
    <div class="foot" id="foot"></div>
  </aside>
  <div id="map"><button type="button" class="map-toggle-btn" id="map-toggle-btn">⤢ Expand Map</button></div>
</div>

async function tryUnlock(pw, save = true) {
  try {
    const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);

      {name: 'PBKDF2', salt: b64(ENC.salt), iterations: ENC.iter, hash: 'SHA-256'},

      {name: 'AES-GCM', length: 256},

<script>
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js', {scope: './'}).catch(() => {});
}
(async () => {
  const hp = new URLSearchParams(location.hash.slice(1));
  const hashPw = hp.get('key') || hp.get('pw');
  if (hashPw) {
    hp.delete('key'); hp.delete('pw');
    history.replaceState(null, '', location.pathname + (hp.toString() ? '#' + hp.toString() : ''));
    if (await tryUnlock(hashPw, true)) return;
  }
  const savedPw = localStorage.getItem('jp26_pw');
  if (savedPw && await tryUnlock(savedPw, false)) return;
  document.getElementById('lock-form').style.visibility = 'visible';
  document.getElementById('lock-form').addEventListener('submit', async e => {
    e.preventDefault();
    const pw = document.getElementById('pw-input').value;
    document.getElementById('pw-err').style.display = 'none';
    if (!(await tryUnlock(pw, true))) {
      document.getElementById('pw-err').style.display = 'block';
    }
  });
})();
</script>
